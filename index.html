<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>IPTU Chain</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:700px;
      background:#1e293b;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 30px rgba(0,0,0,.4);
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      margin-bottom:20px;
      color:#cbd5e1;
    }

    .card{
      background:#334155;
      padding:15px;
      border-radius:12px;
      margin-top:20px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      margin-bottom:10px;
      background:#0f172a;
      color:white;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    #connectBtn{
      background:#38bdf8;
      color:black;
    }

    #anchorBtn{
      background:#22c55e;
      color:white;
    }

    #auditBtn{
      background:#f59e0b;
      color:white;
    }

    small{
      display:block;
      margin-top:10px;
      background:#0f172a;
      padding:10px;
      border-radius:10px;
      word-break:break-all;
    }

    .success{
      color:#22c55e;
      margin-top:10px;
    }

    .error{
      color:#ef4444;
      margin-top:10px;
    }

    a{
      color:#38bdf8;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>IPTU Chain</h1>

    <p>
      Auditoria Fiscal Blockchain Stellar
    </p>

    <!-- WALLET -->

    <button id="connectBtn">
      Conectar Freighter
    </button>

    <div class="card">

      <strong>Carteira</strong>

      <small id="walletAddress">
        Não conectada
      </small>

    </div>

    <!-- REGISTRO -->

    <div class="card">

      <strong>Matrícula</strong>

      <input
        type="text"
        id="matricula"
        placeholder="IPTU-2026-0001"
      />

      <strong>Valor IPTU</strong>

      <input
        type="text"
        id="valor"
        placeholder="1500.00"
      />

      <button id="anchorBtn">
        Gerar SHA-256 + Ancorar
      </button>

      <div id="status"></div>

    </div>

    <!-- AUDITORIA -->

    <div class="card">

      <strong>Auditoria</strong>

      <input
        type="text"
        id="consultaMatricula"
        placeholder="Matrícula"
      />

      <input
        type="text"
        id="consultaValor"
        placeholder="Valor Atual"
      />

      <button id="auditBtn">
        Auditar
      </button>

      <div id="auditResult"></div>

    </div>

  </div>

  <script
    type="module"
    src="./main.js?v=1000"
  ></script>

</body>

</html>
