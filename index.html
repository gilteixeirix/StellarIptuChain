<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>IPTU Chain</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/10.4.1/stellar-sdk.min.js"></script>

<style>

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
  background:#1e293b;
  padding:30px;
  border-radius:20px;
}

.card{
  background:#334155;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:white;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
  font-weight:bold;
}

.connect{
  background:#38bdf8;
}

.anchor{
  background:#22c55e;
  color:white;
}

.audit{
  background:#f59e0b;
  color:white;
}

small{
  display:block;
  margin-top:10px;
  word-break:break-all;
}

.success{
  color:#22c55e;
}

.error{
  color:#ef4444;
}

a{
  color:#38bdf8;
}

</style>

</head>

<body>

<div class="container">

<h1>IPTU Chain</h1>

<p>
Auditoria Fiscal Blockchain Stellar
</p>

<button
  class="connect"
  onclick="connectWallet()"
>
Conectar Freighter
</button>

<div class="card">

<strong>Carteira</strong>

<small id="wallet">
Não conectada
</small>

</div>

<div class="card">

<input
  id="matricula"
  placeholder="Matrícula IPTU"
>

<input
  id="valor"
  placeholder="Valor IPTU"
>

<button
  class="anchor"
  onclick="anchorHash()"
>
Gerar SHA-256 + Ancorar
</button>

<div id="status"></div>

</div>

<div class="card">

<input
  id="consultaMatricula"
  placeholder="Matrícula"
>

<input
  id="consultaValor"
  placeholder="Valor Atual"
>

<button
  class="audit"
  onclick="auditHash()"
>
Auditar
</button>

<div id="auditResult"></div>

</div>

</div>

<script>

console.log("SCRIPT CARREGADO")

const server =
  new StellarSdk.Server(
    "https://horizon-testnet.stellar.org"
  )

let publicKey = ""

const localHashes = {}

async function sha256(message){

  const msgBuffer =
    new TextEncoder().encode(message)

  const hashBuffer =
    await crypto.subtle.digest(
      "SHA-256",
      msgBuffer
    )

  const hashArray =
    Array.from(
      new Uint8Array(hashBuffer)
    )

  return hashArray
    .map(
      b =>
        b.toString(16)
         .padStart(2,"0")
    )
    .join("")
}

/*
  CONNECT
*/

async function connectWallet(){

  try{

    if(!window.freighter){

      alert("Freighter não encontrada")

      return
    }

    const publicKey =
      await window.freighter.getPublicKey()

    console.log(publicKey)

    alert("Wallet encontrada!")

  }catch(err){

    console.error(err)

    alert(err.message)

  }
}

/*
  ANCHOR
*/

async function anchorHash(){

  try{

    console.log("ANCHOR")

    if(!publicKey){

      alert(
        "Conecte a wallet"
      )

      return
    }

    const matricula =
      document.getElementById(
        "matricula"
      ).value

    const valor =
      document.getElementById(
        "valor"
      ).value

    const payload =
      JSON.stringify({

        matricula,
        valor,
        timestamp:
          new Date()
            .toISOString()

      })

    const hash =
      await sha256(payload)

    localHashes[matricula] = {
      payload,
      hash
    }

    const account =
      await server.loadAccount(
        publicKey
      )

    const tx =
      new StellarSdk.TransactionBuilder(
        account,
        {
          fee:
            StellarSdk.BASE_FEE,

          networkPassphrase:
            StellarSdk.Networks.TESTNET
        }
      )

      .addOperation(

        StellarSdk.Operation.manageData({

          name:
            matricula,

          value:
            hash.slice(0,64)

        })

      )

      .setTimeout(30)

      .build()

    /*
      SIGN REAL
    */

    const signedXDR =
      await window.freighter
        .signTransaction(
          tx.toXDR(),
          "TESTNET"
        )

    const signedTx =
      StellarSdk.TransactionBuilder
        .fromXDR(
          signedXDR,
          StellarSdk.Networks.TESTNET
        )

    /*
      SUBMIT REAL
    */

    const result =
      await server.submitTransaction(
        signedTx
      )

    console.log(result)

    const explorer =
      `https://stellar.expert/explorer/testnet/tx/${result.hash}`

    document.getElementById(
      "status"
    ).innerHTML = `

      <p class="success">
        Hash ancorado!
      </p>

      <small>
        ${hash}
      </small>

      <small>
        ${result.hash}
      </small>

      <a
        href="${explorer}"
        target="_blank"
      >
        Ver Explorer
      </a>

    `

  } catch(err){

    console.error(err)

    document.getElementById(
      "status"
    ).innerHTML = `

      <p class="error">
        ${err.message}
      </p>

    `
  }
}

/*
  AUDITORIA
*/

async function auditHash(){

  const matricula =
    document.getElementById(
      "consultaMatricula"
    ).value

  const valor =
    document.getElementById(
      "consultaValor"
    ).value

  const record =
    localHashes[matricula]

  if(!record){

    document.getElementById(
      "auditResult"
    ).innerHTML =
      "<p class='error'>Matrícula não encontrada</p>"

    return
  }

  const original =
    JSON.parse(record.payload)

  const payloadAtual =
    JSON.stringify({

      matricula,
      valor,
      timestamp:
        original.timestamp

    })

  const hashAtual =
    await sha256(payloadAtual)

  const integrity =
    hashAtual ===
    record.hash

  document.getElementById(
    "auditResult"
  ).innerHTML = `

    <p class="${
      integrity
        ? "success"
        : "error"
    }">

      ${
        integrity
          ? "Registro íntegro"
          : "ALTERAÇÃO DETECTADA"
      }

    </p>

  `
}

</script>

</body>

</html>
