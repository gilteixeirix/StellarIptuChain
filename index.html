<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    IPTU Chain
  </title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:700px;
      background:#1e293b;
      padding:30px;
      border-radius:20px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:10px;
    }

    .card{
      background:#334155;
      padding:15px;
      border-radius:12px;
      margin-top:20px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      margin-bottom:10px;
      background:#0f172a;
      color:white;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    .connect-btn{
      background:#38bdf8;
      color:black;
    }

    .anchor-btn{
      background:#22c55e;
      color:white;
    }

    .audit-btn{
      background:#f59e0b;
      color:white;
    }

    small{
      display:block;
      margin-top:10px;
      background:#0f172a;
      padding:10px;
      border-radius:10px;
      word-break:break-all;
    }

    .success{
      color:#22c55e;
      margin-top:10px;
    }

    .error{
      color:#ef4444;
      margin-top:10px;
    }

    a{
      color:#38bdf8;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>
      IPTU Chain
    </h1>

    <p>
      Auditoria Fiscal Blockchain Stellar
    </p>

    <button
      class="connect-btn"
      onclick="connectWallet()"
    >
      Conectar Freighter
    </button>

    <div class="card">

      <strong>
        Carteira
      </strong>

      <small id="walletAddress">
        Não conectada
      </small>

    </div>

    <div class="card">

      <strong>
        Matrícula
      </strong>

      <input
        type="text"
        id="matricula"
        placeholder="IPTU-2026-0001"
      >

      <strong>
        Valor IPTU
      </strong>

      <input
        type="text"
        id="valor"
        placeholder="1500.00"
      >

      <button
        class="anchor-btn"
        onclick="anchorHash()"
      >
        Gerar SHA-256 + Ancorar
      </button>

      <div id="status"></div>

    </div>

    <div class="card">

      <strong>
        Auditoria
      </strong>

      <input
        type="text"
        id="consultaMatricula"
        placeholder="Matrícula"
      >

      <input
        type="text"
        id="consultaValor"
        placeholder="Valor Atual"
      >

      <button
        class="audit-btn"
        onclick="auditHash()"
      >
        Auditar
      </button>

      <div id="auditResult"></div>

    </div>

  </div>

  <script type="module">

import {
  Horizon,
  TransactionBuilder,
  Networks,
  BASE_FEE,
  Operation
}
from "https://cdn.jsdelivr.net/npm/@stellar/stellar-sdk/+esm"

import {
  isConnected,
  requestAccess,
  getAddress,
  signTransaction
}
from "https://cdn.jsdelivr.net/npm/@stellar/freighter-api/+esm"

const server =
 new Horizon.Server(
    "https://horizon-testnet.stellar.org"
  )

    let publicKey = ""

    const localHashes = {}

    /*
      SHA-256
    */

    async function generateSHA256(payload){

      const encoder =
        new TextEncoder()

      const data =
        encoder.encode(payload)

      const hashBuffer =
        await crypto.subtle.digest(
          "SHA-256",
          data
        )

      const hashArray =
        Array.from(
          new Uint8Array(hashBuffer)
        )

      return hashArray
        .map(
          b =>
            b.toString(16)
             .padStart(2,"0")
        )
        .join("")
    }

    /*
      CONNECT
    */

    window.connectWallet =
      async function(){

        try{

          const connected =
            await isConnected()

          if(
            !connected.isConnected
          ){

            alert(
              "Freighter não encontrada"
            )

            return
          }

          await requestAccess()

          const addressObj =
            await getAddress()

          publicKey =
            addressObj.address

          /*
            TESTE REAL
          */

          await server.loadAccount(
            publicKey
          )

          document.getElementById(
            "walletAddress"
          ).innerText =
            publicKey

          alert(
            "Wallet REAL conectada!"
          )

        } catch(err){

          console.error(err)

          alert(err.message)
        }
      }

    /*
      ANCHOR
    */

    window.anchorHash =
      async function(){

        try{

          if(!publicKey){

            alert(
              "Conecte a wallet"
            )

            return
          }

          const matricula =
            document.getElementById(
              "matricula"
            ).value

          const valor =
            document.getElementById(
              "valor"
            ).value

          const payload =
            JSON.stringify({

              matricula,

              valor,

              timestamp:
                new Date()
                  .toISOString()

            })

          /*
            SHA
          */

          const hashHex =
            await generateSHA256(
              payload
            )

          localHashes[matricula] = {

            payload,

            hash: hashHex

          }

          /*
            ACCOUNT
          */

          const account =
            await server.loadAccount(
              publicKey
            )

          /*
            TX
          */

          const tx =
            new TransactionBuilder(
              account,
              {
                fee:
                  BASE_FEE,

                networkPassphrase:
                  Networks.TESTNET
              }
            )

            .addOperation(

              Operation.manageData({

                name:
                  matricula.slice(0,64),

                value:
                  hashHex.slice(0,64)

              })

            )

            .setTimeout(30)

            .build()

          /*
            SIGN
          */

          const signed =
            await signTransaction(
              tx.toXDR(),
              {
                networkPassphrase:
                  Networks.TESTNET
              }
            )

          /*
            REBUILD
          */

          const signedTx =
            TransactionBuilder
              .fromXDR(
                signed.signedTxXdr,
                Networks.TESTNET
              )

          /*
            SUBMIT REAL
          */

          const result =
            await server.submitTransaction(
              signedTx
            )

          console.log(result)

          const explorerUrl =
            `https://stellar.expert/explorer/testnet/tx/${result.hash}`

          document.getElementById(
            "status"
          ).innerHTML = `

            <p class="success">
              Hash ancorado!
            </p>

            <small>
              ${hashHex}
            </small>

            <small>
              ${result.hash}
            </small>

            <br><br>

            <a
              href="${explorerUrl}"
              target="_blank"
            >
              Ver Explorer
            </a>

          `

        } catch(err){

          console.error(err)

          document.getElementById(
            "status"
          ).innerHTML = `

            <p class="error">
              ${err.message}
            </p>

          `
        }
      }

    /*
      AUDITORIA
    */

    window.auditHash =
      async function(){

        try{

          const matricula =
            document.getElementById(
              "consultaMatricula"
            ).value

          const valorAtual =
            document.getElementById(
              "consultaValor"
            ).value

          const record =
            localHashes[matricula]

          if(!record){

            document.getElementById(
              "auditResult"
            ).innerHTML = `

              <p class="error">
                Matrícula não encontrada
              </p>

            `

            return
          }

          const originalData =
            JSON.parse(
              record.payload
            )

          const payloadAtual =
            JSON.stringify({

              matricula,

              valor:
                valorAtual,

              timestamp:
                originalData.timestamp

            })

          const recalculatedHash =
            await generateSHA256(
              payloadAtual
            )

          const integrity =
            recalculatedHash ===
            record.hash

          document.getElementById(
            "auditResult"
          ).innerHTML = `

            <p class="${
              integrity
                ? "success"
                : "error"
            }">

              ${
                integrity
                  ? "Registro íntegro"
                  : "ALTERAÇÃO DETECTADA"
              }

            </p>

          `

        } catch(err){

          console.error(err)
        }
      }

  </script>

</body>

</html>
