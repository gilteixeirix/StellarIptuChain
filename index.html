<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>IPTU Chain</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/10.4.1/stellar-sdk.min.js"></script>

</head>

<body>

  <div class="container">

    <h1>IPTU Chain</h1>

    <p>
      Auditoria municipal com Stellar Testnet
    </p>

    <button
      class="connect-btn"
      onclick="connectWallet()"
    >
      Conectar Freighter
    </button>

    <div class="card">

      <strong>
        Carteira
      </strong>

      <div id="walletAddress">
        Não conectada
      </div>

    </div>

    <div class="card">

      <strong>
        Matrícula do imóvel
      </strong>

      <input
        type="text"
        id="matricula"
        placeholder="IPTU-2026-0001"
      />

      <strong>
        Valor IPTU
      </strong>

      <input
        type="text"
        id="valor"
        placeholder="1500.00"
      />

      <button
        class="anchor-btn"
        onclick="anchorHash()"
      >
        Gerar + Ancorar Hash
      </button>

      <div id="status"></div>

    </div>

    <div class="card">

      <strong>
        Consulta / Auditoria
      </strong>

      <input
        type="text"
        id="consultaMatricula"
        placeholder="Consultar matrícula"
      />

      <button
        class="audit-btn"
        onclick="auditHash()"
      >
        Auditar Matrícula
      </button>

      <div id="auditResult"></div>

    </div>

  </div>

  <script src="main.js"></script>

</body>

</html>
