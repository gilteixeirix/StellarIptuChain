<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    IPTU Chain
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="container">

    <h1>
      IPTU Chain
    </h1>

    <p>
      Auditoria Fiscal com Blockchain Stellar
    </p>

    <!-- WALLET -->

    <button
      class="connect-btn"
      onclick="connectWallet()"
    >
      Conectar Carteira
    </button>

    <div class="card">

      <strong>
        Carteira Conectada
      </strong>

      <small id="walletAddress">
        Não conectada
      </small>

    </div>

    <!-- REGISTRO -->

    <div class="card">

      <strong>
        Matrícula do Imóvel
      </strong>

      <input
        type="text"
        id="matricula"
        placeholder="IPTU-2026-0001"
      >

      <strong>
        Valor IPTU
      </strong>

      <input
        type="text"
        id="valor"
        placeholder="1500.00"
      >

      <button
        class="anchor-btn"
        onclick="anchorHash()"
      >
        Gerar SHA-256 + Ancorar
      </button>

      <div id="status"></div>

    </div>

    <!-- AUDITORIA -->

    <div class="card">

      <strong>
        Auditoria por Matrícula
      </strong>

      <input
        type="text"
        id="consultaMatricula"
        placeholder="Digite a matrícula"
      >

      <strong>
        Valor Atual IPTU
      </strong>

      <input
        type="text"
        id="consultaValor"
        placeholder="Digite o valor atual"
      >

      <button
        class="audit-btn"
        onclick="auditHash()"
      >
        Auditar Registro
      </button>

      <div id="auditResult"></div>

    </div>

  </div>

  <script src="main.js"></script>

</body>

</html>
