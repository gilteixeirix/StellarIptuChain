<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTU Chain - Stellar Wallet</title>

  <script type="module">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p {
      text-align: center;
      margin-bottom: 20px;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .connect-btn {
      background: #38bdf8;
      color: black;
      font-weight: bold;
    }

    .connect-btn:hover {
      background: #0ea5e9;
    }

    .anchor-btn {
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .anchor-btn:hover {
      background: #16a34a;
    }

    .card {
      margin-top: 20px;
      background: #334155;
      padding: 15px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
      background: #0f172a;
      color: white;
    }

    .success {
      color: #22c55e;
      margin-top: 10px;
    }

    .error {
      color: #ef4444;
      margin-top: 10px;
    }

    .tx-link {
      color: #38bdf8;
      text-decoration: none;
    }

    .tx-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>IPTU Chain</h1>
    <p>Auditoria de IPTU usando Stellar Testnet</p>

    <button class="connect-btn" onclick="connectWallet()">
      Conectar Carteira Stellar
    </button>

    <div class="card">
      <strong>Carteira:</strong>
      <div id="walletAddress">Não conectada</div>
    </div>

    <div class="card">
      <strong>Matrícula do Imóvel</strong>
      <input type="text" id="matricula" placeholder="Ex: IPTU-2026-0001" />

      <strong style="display:block; margin-top:15px;">Valor IPTU</strong>
      <input type="text" id="valor" placeholder="Ex: 1500.00" />

      <button class="anchor-btn" onclick="anchorHash()">
        Ancorar Hash na Stellar Testnet
      </button>

      <div id="status"></div>
    </div>
  </div>

  <script>

    let publicKey = "";

    const server = new StellarSdk.Horizon.Server(
      "https://horizon-testnet.stellar.org"
    );

    StellarSdk.Networks.TESTNET;

    async function connectWallet() {
      try {

        if (!window.freighterApi) {
          alert("Freighter Wallet não encontrada");
          return;
        }

        const response = await window.freighterApi.getAddress();

        publicKey = response.address;

        document.getElementById("walletAddress").innerText = publicKey;

        alert("Carteira conectada com sucesso!");

      } catch (error) {

        console.error(error);
        alert("Erro ao conectar carteira");
      }
    }

    async function anchorHash() {

      try {

        if (!publicKey) {
          alert("Conecte a carteira primeiro");
          return;
        }

        const matricula = document.getElementById("matricula").value;
        const valor = document.getElementById("valor").value;

        if (!matricula || !valor) {
          alert("Preencha os campos");
          return;
        }

        const payload = `${matricula}-${valor}-${Date.now()}`;

        const encoder = new TextEncoder();
        const data = encoder.encode(payload);

        const hashBuffer = await crypto.subtle.digest('SHA-256', data);

        const hashArray = Array.from(new Uint8Array(hashBuffer));

        const hashHex = hashArray
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');

        document.getElementById("status").innerHTML = `
          <p>Hash gerado:</p>
          <small>${hashHex}</small>
        `;

        const account = await server.loadAccount(publicKey);

        const transaction = new StellarSdk.TransactionBuilder(account, {
          fee: StellarSdk.BASE_FEE,
          networkPassphrase: StellarSdk.Networks.TESTNET,
        })
        .addOperation(
          StellarSdk.Operation.manageData({
            name: "iptu_hash",
            value: hashHex.slice(0, 64)
          })
        )
        .setTimeout(30)
        .build();

        const signedTx = await window.freighterApi.signTransaction(
          transaction.toXDR(),
          {
            networkPassphrase: StellarSdk.Networks.TESTNET
          }
        );

        const tx = StellarSdk.TransactionBuilder.fromXDR(
          signedTx.signedTxXdr,
          StellarSdk.Networks.TESTNET
        );

        const result = await server.submitTransaction(tx);

        document.getElementById("status").innerHTML += `
          <p class="success">Hash ancorado com sucesso!</p>
          <p>TX Hash:</p>
          <small>${result.hash}</small>
          <br/><br/>
          <a
            class="tx-link"
            href="https://stellar.expert/explorer/testnet/tx/${result.hash}"
            target="_blank"
          >
            Ver transação no explorer
          </a>
        `;

      } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML = `
          <p class="error">Erro ao enviar transação</p>
          <small>${error.message}</small>
        `;
      }
    }

  </script>

</body>
</html>
<script type="module">

import {
  isConnected,
  requestAccess,
  getAddress,
  signTransaction
} from "https://esm.sh/@stellar/freighter-api";

import * as StellarSdk from "https://esm.sh/@stellar/stellar-sdk";

window.connectWallet = async function () {

  try {

    const connected = await isConnected();

    if (!connected.isConnected) {
      alert("Freighter não encontrada");
      return;
    }

    await requestAccess();

    const addressObj = await getAddress();

    window.publicKey = addressObj.address;

    document.getElementById("walletAddress").innerText =
      window.publicKey;

    alert("Carteira conectada!");

  } catch (error) {

    console.error(error);

    alert(error.message);
  }
};

window.anchorHash = async function () {

  try {

    if (!window.publicKey) {
      alert("Conecte a carteira");
      return;
    }

    const matricula =
      document.getElementById("matricula").value;

    const valor =
      document.getElementById("valor").value;

    const payload =
      `${matricula}-${valor}-${Date.now()}`;

    const encoder = new TextEncoder();

    const data = encoder.encode(payload);

    const hashBuffer =
      await crypto.subtle.digest("SHA-256", data);

    const hashArray =
      Array.from(new Uint8Array(hashBuffer));

    const hashHex = hashArray
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");

    const server = new StellarSdk.Horizon.Server(
      "https://horizon-testnet.stellar.org"
    );

    const account =
      await server.loadAccount(window.publicKey);

    const tx = new StellarSdk.TransactionBuilder(account, {
      fee: StellarSdk.BASE_FEE,
      networkPassphrase:
        StellarSdk.Networks.TESTNET
    })
      .addOperation(
        StellarSdk.Operation.manageData({
          name: "iptu_hash",
          value: hashHex.slice(0, 64)
        })
      )
      .setTimeout(30)
      .build();

    const signed = await signTransaction(
      tx.toXDR(),
      {
        networkPassphrase:
          StellarSdk.Networks.TESTNET
      }
    );

    const finalTx =
      StellarSdk.TransactionBuilder.fromXDR(
        signed.signedTxXdr,
        StellarSdk.Networks.TESTNET
      );

    const result =
      await server.submitTransaction(finalTx);

    document.getElementById("status").innerHTML = `
      <p style="color:lime">
        Hash ancorado!
      </p>

      <small>${result.hash}</small>
    `;

  } catch (error) {

    console.error(error);

    alert(error.message);
  }
};

</script>
