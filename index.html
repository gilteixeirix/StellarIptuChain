<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPTU Chain</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
    :root {
      --bg: #0f1724;
      --card: #071329;
      --accent: #7c3aed;
      --muted: #9fb0c8;
      color: #e6eef8
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #071022 0%, #071733 100%);
      font-family: Inter, Arial, sans-serif;
      color: var(--muted);
      padding: 20px
    }

    .wrap {
      max-width: 980px;
      margin: 12px auto
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    h1 {
      color: #fff;
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.8rem)
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.6)
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      background: transparent;
      color: var(--muted);
      box-sizing: border-box
    }

    button {
      background: var(--accent);
      color: #fff;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .result {
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.18);
      padding: 10px;
      border-radius: 8px;
      color: #dcefff;
      margin-top: 8px
    }

    .muted {
      font-size: 13px
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>
      <h1>IPTU Chain</h1>
      <button id="connectBtn">Conectar MetaMask</button>
      <div class="muted">
        Conta: <span id="addr">—</span>
      </div>
    </header>

    <!-- CONTRATO -->
    <div class="card">

      <div style="display:flex; align-items:center; gap:10px;">

        <label>Endereço do contrato</label>

        <input id="contractAddr"
          type="text"
          placeholder="0x..."
          style="width:500px; height:28px; margin-top:20px;" />

      </div>

      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="loadBtn">Carregar contrato</button>
        <button id="refreshBtn">Atualizar dados</button>
      </div>

      <div class="result" id="status">
        Aguardando ação...
      </div>

    </div>

    <!-- CONSULTA -->
    <div class="card">

      <h3 style="color:#fff;margin-top:0">
        Consultar Lançamento
      </h3>

      <div class="row">

        <div>
          <label>Inscrição</label>
          <input id="inscricao" placeholder="12345-6">
        </div>

        <div>
          <label>Ano</label>
          <input id="ano" placeholder="2025">
        </div>

      </div>

      <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">

        <label>ID</label>

        <input id="idField"
          type="text"
          placeholder="0x..."
          style="width:500px; height:28px;" />

      </div>

      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="makeIdBtn">Gerar ID</button>
        <button id="consultBtn">Consultar Resumo</button>
      </div>

      <div class="result" id="resumoArea">—</div>

    </div>

    <!-- PAGAMENTO -->
    <div class="card">

      <h3 style="color:#fff;margin-top:0">
        Pagar Parcela
      </h3>

      <label>ID do lançamento</label>
      <input id="payId" placeholder="0x...">

      <div class="row">

        <div>
          <label>Nº Parcela</label>
          <input id="parcelaNum" placeholder="1">
        </div>

        <div>
          <label>Valor ETH</label>
          <input id="parcelaVal" placeholder="0.1">
        </div>

      </div>

      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="fillParcelValue">
          Buscar valor oficial
        </button>

        <button id="payBtn">
          Pagar Parcela
        </button>
      </div>

      <div class="result" id="payStatus">—</div>

    </div>

    <!-- ADMIN -->
    <div class="card" id="adminCard" style="display:none">

      <h3 style="color:#fff;margin-top:0">
        Administração
      </h3>

      <label>Inscrição</label>
      <input id="l_inscricao">

      <label>Contribuinte</label>
      <input id="l_contribuinte" placeholder="0x...">

      <div class="row">

        <div>
          <label>Ano</label>
          <input id="l_ano">
        </div>

        <div>
          <label>Parcelas</label>
          <input id="l_parcelas">
        </div>

      </div>

      <label>Total ETH</label>
      <input id="l_total">

      <div style="margin-top:8px;">
        <button id="lancarBtn">
          Lançar IPTU
        </button>
      </div>

      <div class="result" id="lancarStatus">—</div>

    </div>

  </div>

  <script>

const ABI = [

  "function prefeitura() view returns(address)",
  "function owner() view returns(address)",

  "function lancarIPTU(string inscricao,address contribuinte,uint256 ano,uint256 total,uint256 parcelas) returns(bytes32)",

  "function pagarParcela(bytes32 id,uint256 parcela) payable",

  "function getResumo(bytes32 id) view returns(string,address,uint256,uint256,uint256,uint256,uint256,uint256,bool)",

  "function listarParcelasPagas(bytes32 id) view returns(bool[])",

  "event ParcelaPaga(bytes32 indexed id,uint256 indexed parcela,address indexed pagador,uint256 valor,uint256 timestamp)"
];

    let provider;
    let signer;
    let contract;
    let connectedAddress;

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    // CONNECT

    document.getElementById('connectBtn').onclick = async () => {

      try {

        if (!window.ethereum) {
          alert('MetaMask não encontrada');
          return;
        }

        await window.ethereum.request({
          method: 'eth_requestAccounts'
        });

        provider = new ethers.providers.Web3Provider(window.ethereum);

        signer = provider.getSigner();

        connectedAddress = await signer.getAddress();

        document.getElementById('addr').textContent =
          connectedAddress;

        setStatus('Carteira conectada');

      } catch (e) {

        console.log(e);
        alert('Erro conexão');

      }

    };

    // LOAD CONTRACT

    document.getElementById('loadBtn').onclick = async () => {

      try {

        if (!provider) {
          alert('Conecte a MetaMask primeiro');
          return;
        }

        const addr =
          document.getElementById('contractAddr')
          .value.trim();

        if (!ethers.utils.isAddress(addr)) {
          alert('Contrato inválido');
          return;
        }

        contract =
          new ethers.Contract(
            addr,
            ABI,
            signer
          );

        setStatus('Contrato carregado');

        const owner =
          await contract.owner();

        const prefeitura =
          await contract.prefeitura();

        if (
          connectedAddress.toLowerCase() === owner.toLowerCase() ||
          connectedAddress.toLowerCase() === prefeitura.toLowerCase()
        ) {

          document.getElementById('adminCard')
            .style.display = 'block';

        }

        // EVENTOS

if(contract && contract.filters.ParcelaPaga){

  contract.on(
    'ParcelaPaga',
    (
      id,
      parcela,
      pagador,
      valor,
      timestamp
    ) => {

      console.log('Evento:', {
        id,
        parcela: parcela.toString(),
        pagador,
        valor: ethers.utils.formatEther(valor),
        timestamp: timestamp.toString()
      });

    }
  );

}

      } catch (e) {

        console.log(e);
        alert('Erro carregar contrato');

      }

    };

    // GERAR ID

    document.getElementById('makeIdBtn').onclick = () => {

      try {

        const inscr =
          document.getElementById('inscricao')
          .value.trim();

        const ano =
          Number(
            document.getElementById('ano').value
          );

        const id =
          ethers.utils.solidityKeccak256(
            ['string', 'uint256'],
            [inscr, ano]
          );

        document.getElementById('idField').value =
          id;

        document.getElementById('payId').value =
          id;

      } catch (e) {

        console.log(e);
        alert('Erro gerar ID');

      }

    };

    // CONSULTA

    document.getElementById('consultBtn').onclick =
      async () => {

        try {

          if (!contract) {
            alert('Carregue o contrato');
            return;
          }

          const id =
            document.getElementById('idField')
            .value.trim();

          const r =
            await contract.getResumo(id);

          const parcelas =
            await contract.listarParcelasPagas(id);

          let texto = '';

          texto += 'Inscrição: ' + r[0] + '\n';
          texto += 'Contribuinte: ' + r[1] + '\n';
          texto += 'Ano: ' + r[2] + '\n';
          texto += 'Total: '
            + ethers.utils.formatEther(r[3])
            + ' ETH\n';

          texto += 'Parcelas: ' + r[4] + '\n';

          texto += 'Valor Parcela: '
            + ethers.utils.formatEther(r[5])
            + ' ETH\n';

          texto += 'Pagas: ' + r[6] + '\n';

          texto += 'Valor Pago: '
            + ethers.utils.formatEther(r[7])
            + ' ETH\n';

          texto += 'Ativo: '
            + r[8] + '\n';

          texto += '\nParcelas:\n';

          parcelas.forEach((p, i) => {

            texto +=
              `Parcela ${i + 1}: `
              + (p ? 'PAGA' : 'ABERTA')
              + '\n';

          });

          document.getElementById('resumoArea')
            .textContent = texto;

          document.getElementById('parcelaVal')
            .value =
            ethers.utils.formatEther(r[5]);

        } catch (e) {

          console.log(e);
          alert('Erro consulta');

        }

      };

    // BUSCAR VALOR

    document.getElementById('fillParcelValue')
      .onclick = async () => {

        try {

          const id =
            document.getElementById('payId')
            .value.trim();

          const r =
            await contract.getResumo(id);

          document.getElementById('parcelaVal')
            .value =
            ethers.utils.formatEther(r[5]);

        } catch (e) {

          console.log(e);

        }

      };

    // PAGAR

    document.getElementById('payBtn').onclick =
      async () => {

        try {

          const id =
            document.getElementById('payId')
            .value.trim();

          const parcela =
            Number(
              document.getElementById('parcelaNum')
              .value
            );

          const valor =
            document.getElementById('parcelaVal')
            .value.trim();

          const valueWei =
            ethers.utils.parseEther(valor);

          const tx =
            await contract.pagarParcela(
              id,
              parcela,
              {
                value: valueWei
              }
            );

          document.getElementById('payStatus')
            .textContent =
            'Transação enviada:\n'
            + tx.hash;

          const receipt =
            await tx.wait();

          const explorer =
            'https://polygonscan.com/tx/'
            + tx.hash;

          document.getElementById('payStatus')
            .textContent +=

            '\n\n✅ Confirmada'
            + '\nBloco: '
            + receipt.blockNumber
            + '\nExplorer:\n'
            + explorer;

        } catch (e) {

          console.log(e);
          alert('Erro pagamento');

        }

      };

    // LANÇAR IPTU

    document.getElementById('lancarBtn')
      .onclick = async () => {

        try {

          const inscr =
            document.getElementById('l_inscricao')
            .value.trim();

          const contribuinte =
            document.getElementById('l_contribuinte')
            .value.trim();

          const ano =
            Number(
              document.getElementById('l_ano')
              .value
            );

          const parcelas =
            Number(
              document.getElementById('l_parcelas')
              .value
            );

          const totalEth =
            document.getElementById('l_total')
            .value.trim();

          const totalWei =
            ethers.utils.parseEther(totalEth);

          const tx =
            await contract.lancarIPTU(
              inscr,
              contribuinte,
              ano,
              totalWei,
              parcelas
            );

          document.getElementById('lancarStatus')
            .textContent =
            'Tx enviada:\n'
            + tx.hash;

          await tx.wait();

          document.getElementById('lancarStatus')
            .textContent +=
            '\n✅ Confirmada';

        } catch (e) {

          console.log(e);
          alert('Erro lançar IPTU');

        }

      };

  </script>

</body>

</html>
